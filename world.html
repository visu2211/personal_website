<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vishal's World</title>
<meta name="description" content="An interactive globe of the places that shaped Vishal Kanala.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1512'/%3E%3Cpath d='M12.5 4 16 8.5 19.5 4' fill='none' stroke='%23ff7b3a' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 8.5 4.5 26h23L16 8.5Z' fill='%23ff7b3a'/%3E%3Cpath d='M16 14 12.5 26h7L16 14Z' fill='%230d1512'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600&family=Young+Serif&display=swap">
<link rel="stylesheet" href="assets/style.css">
<style>
  /* Full-screen world view: the globe is the page. Title bottom-left, places along the bottom, card on the right. */
  :root { --k-home: #ff7b3a; --k-school: #e9e48a; --k-work: #7fcf8f; --k-visited: #93a397; }
  html, body { height: 100%; }
  body { overflow: hidden; background: #0b0b0c; }
  #globe { position: fixed; inset: 0; z-index: 1; cursor: grab; }
  #globe:active { cursor: grabbing; }
  .ui { position: fixed; z-index: 3; pointer-events: none; }
  .ui > * { pointer-events: auto; }
  .back { top: calc(env(safe-area-inset-top, 0px) + 22px); left: var(--gutter); }
  .back a { font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--lichen); text-decoration: none; transition: color .2s; }
  .back a:hover { color: var(--ember); }
  .legend { top: calc(env(safe-area-inset-top, 0px) + 22px); right: var(--gutter); display: flex; gap: 16px; flex-wrap: wrap; justify-content: flex-end;
    font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--lichen); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 7px; box-shadow: 0 0 8px currentColor; }
  .title { left: var(--gutter); bottom: calc(env(safe-area-inset-bottom, 0px) + 120px); }
  .title .eyebrow { margin-bottom: 8px; }
  .title h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(44px, 6.4vw, 84px); line-height: .95; letter-spacing: -.01em; color: #f2f2f2; }
  .title .eyebrow { color: #8b8f94; }
  .title p { margin: 10px 0 0; color: var(--lichen); font-size: 15px; max-width: 34ch; }
  .chips { left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); width: min(980px, calc(100% - 2 * var(--gutter)));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .chips button { display: inline-flex; align-items: center; gap: 8px; font: 500 11.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--lichen);
    background: color-mix(in srgb, var(--pine) 75%, transparent); backdrop-filter: blur(6px); border: 1px solid var(--moss); border-radius: 999px; padding: 8px 14px; cursor: pointer; transition: color .2s, border-color .2s, transform .2s; }
  .chips button i { width: 7px; height: 7px; border-radius: 50%; }
  .chips button:hover { color: var(--bone); transform: translateY(-2px); }
  .chips button[aria-pressed="true"] { color: var(--bone); border-color: var(--ember); }
  .card { right: var(--gutter); top: 50%; transform: translateY(-50%); width: min(360px, calc(100% - 2 * var(--gutter))); padding: 22px; border-radius: 18px;
    background: color-mix(in srgb, var(--pine) 86%, transparent); backdrop-filter: blur(12px); border: 1px solid var(--moss); box-shadow: 0 30px 60px -24px #000;
    animation: cardIn .5s cubic-bezier(.2,.8,.2,1); }
  @keyframes cardIn { from { opacity: 0; transform: translate(16px, -50%); } }
  .card .pk { font-family: var(--f-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; display: flex; gap: 8px; align-items: center; }
  .card .pk i { width: 8px; height: 8px; border-radius: 50%; }
  .card h2 { font-size: 36px; margin-top: 8px; }
  .card .meta { font-family: var(--f-mono); font-size: 11.5px; color: var(--lichen); margin-top: 6px; }
  .card p { margin: 12px 0 0; color: #d4cfc0; font-size: 15.5px; }
  .card .strip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
  .card .strip button { aspect-ratio: 4 / 3; border: 0; padding: 0; border-radius: 10px; overflow: hidden; cursor: zoom-in; background: var(--night); }
  .card .strip img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s; }
  .card .strip button:hover img { transform: scale(1.06); }
  .card .strip .empty { aspect-ratio: 4 / 3; border-radius: 10px; border: 1px dashed var(--moss); background: repeating-linear-gradient(135deg, #1a231f 0 8px, #1e2924 8px 16px);
    display: grid; place-items: center; font-family: var(--f-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--lichen); }
  .card .close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--moss); background: var(--night); color: var(--lichen); cursor: pointer; }
  .card .close:hover { color: var(--ember); border-color: var(--ember); }
  .card .foot { margin-top: 14px; display: flex; justify-content: space-between; gap: 12px; font-size: 13px; }
  .card .foot a { color: var(--ember); text-decoration: none; font-weight: 500; }
  .loading { inset: 0; display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--lichen); z-index: 2; }
  dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: min(92vw, 1200px); max-height: 94vh; }
  dialog.lightbox::backdrop { background: #050807eb; backdrop-filter: blur(4px); }
  dialog.lightbox img { max-height: 84vh; width: auto; max-width: 100%; display: block; margin: 0 auto; border-radius: 8px; }
  dialog.lightbox .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; color: var(--bone); font-size: 14px; }
  dialog.lightbox button { font: 500 13px var(--f-body); color: var(--bone); background: var(--pine); border: 1px solid var(--moss); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  @media (max-width: 760px) {
    .title { bottom: auto; top: calc(env(safe-area-inset-top, 0px) + 64px); }
    .title p { display: none; }
    .legend { display: none; }
    .card { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 110px); transform: none; right: 50%; translate: 50% 0; animation: none; }
    .chips { gap: 6px; }
    .chips button { padding: 6px 10px; font-size: 10.5px; }
  }
</style>
</head>
<body>
<div id="globe" role="img" aria-label="Interactive spinning globe of the places that shaped me"></div>
<div class="ui loading" id="loading">Loading the world…</div>

<div class="ui back"><a href="scrapbook.html">← Back</a></div>
<div class="ui legend" aria-hidden="true">
  <span><i style="background:var(--k-home);color:var(--k-home)"></i>Home</span>
  <span><i style="background:var(--k-school);color:var(--k-school)"></i>School</span>
  <span><i style="background:var(--k-work);color:var(--k-work)"></i>Work</span>
  <span><i style="background:var(--k-visited);color:var(--k-visited)"></i>Visited</span>
</div>
<div class="ui title">
  <div class="eyebrow">Explore</div>
  <h1>Vishal's World</h1>
  <p>The places that shaped me. Drag to spin, scroll to zoom, tap a place to fly there.</p>
</div>
<aside class="ui card" id="card" hidden aria-live="polite"></aside>
<nav class="ui chips" id="chips" aria-label="Places"></nav>

<dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
  <img id="lb-img" alt="">
  <div class="bar"><button type="button" id="lb-prev">← Prev</button><span id="lb-cap"></span><span style="display:flex;gap:8px"><button type="button" id="lb-next">Next →</button><button type="button" id="lb-close">Close</button></span></div>
</dialog>

<script src="assets/places.js"></script>
<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const when = (d) => d ? `${MONTHS[+d.slice(5, 7) - 1] || ''} ${d.slice(0, 4)}`.trim() : 'Home';
  const deg = (v, pos, neg) => `${Math.abs(v).toFixed(2)}° ${v >= 0 ? pos : neg}`;
  const KIND = (p) => p.kind || ({ Hometown: 'home', Rutgers: 'school', Internship: 'work' }[p.tag]) || 'visited';
  const KCOL = { home: '#ff7b3a', school: '#e9e48a', work: '#7fcf8f', visited: '#93a397' };
  const KLABEL = { home: 'Home', school: 'School', work: 'Work', visited: 'Visited' };
  const places = [...(window.PLACES || [])].sort((a, b) => (a.date || '').localeCompare(b.date || ''));


  /* ---------- place chips ---------- */
  $('chips').innerHTML = places.map((p, i) => `<button type="button" data-i="${i}" aria-pressed="false"><i style="background:${KCOL[KIND(p)]}"></i>${esc(p.name)}</button>`).join('');
  $('chips').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) select(+b.dataset.i); });

  if (typeof Globe !== 'function') { $('loading').textContent = 'The globe could not load. Check your connection and refresh.'; return; }
  $('loading').remove();

  /* ---------- globe ---------- */
  const el = $('globe');
  const SEL = { p: null };
  const world = Globe()(el)
    .backgroundColor('rgba(0,0,0,0)')
    .globeImageUrl('assets/globe/earth-night.jpg')
    .bumpImageUrl('assets/globe/earth-topology.png')
    .showAtmosphere(false)
    .pointsData(places).pointLat('lat').pointLng('lng').pointsMerge(false).pointResolution(24)
    .pointColor((p) => KCOL[KIND(p)]).pointAltitude(0.008).pointRadius((p) => (p === SEL.p ? 0.5 : 0.36))
    .pointLabel((p) => `<div style="font:500 12px Hanken Grotesk,sans-serif;background:#141f1bee;border:1px solid #26352f;color:#ebe5d5;padding:5px 9px;border-radius:8px">${esc(p.name)}</div>`)
    .onPointClick((p) => select(places.indexOf(p)))
    .onPointHover((p) => { el.style.cursor = p ? 'pointer' : 'grab'; })
    .ringsData([]).ringLat('lat').ringLng('lng').ringAltitude(0.004)
    .ringColor(() => (t) => `rgba(235,235,240,${0.8 * (1 - t)})`)
    .ringMaxRadius(1.8).ringPropagationSpeed(0.8).ringRepeatPeriod(1100)
    .labelsData([]).labelLat((p) => p.lat + 0.55).labelLng('lng').labelText('name').labelSize(0.45).labelDotRadius(0).labelAltitude(0.008)
    .labelColor(() => '#ebe5d5').labelResolution(3).labelIncludeDot(false);
  // brighter, blue-tinted night globe with soft shading
  const mat = world.globeMaterial();
  mat.color.set('#bcd4ff'); mat.emissive.set('#0a1a36'); mat.emissiveIntensity = 0.55; mat.shininess = 6;
  window.__globe = world;

  const c = world.controls();
  c.autoRotate = !reduce; c.autoRotateSpeed = 0.45; c.enableDamping = true; c.dampingFactor = 0.08;
  c.minDistance = 130; c.maxDistance = 520;
  const start = places.find((p) => KIND(p) === 'home') || places[0] || { lat: 20, lng: -40 };
  world.pointOfView({ lat: 28, lng: start.lng - 40, altitude: 2.8 });
  setTimeout(() => world.pointOfView({ lat: start.lat - 2, lng: start.lng + 14, altitude: 2.25 }, 2600), 300);

  // keep it spinning: pause while the visitor is interacting or reading a card, resume after they stop
  let resumeTimer;
  const pause = () => { c.autoRotate = false; clearTimeout(resumeTimer); };
  const resumeLater = (ms = 4000) => { clearTimeout(resumeTimer); if (!reduce && $('card').hidden) resumeTimer = setTimeout(() => (c.autoRotate = true), ms); };
  el.addEventListener('pointerdown', pause);
  el.addEventListener('pointerup', () => resumeLater());
  el.addEventListener('wheel', () => { pause(); resumeLater(); }, { passive: true });

  const fit = () => world.width(innerWidth).height(innerHeight);
  addEventListener('resize', fit); fit();

  /* ---------- selection ---------- */
  function select(i) {
    const p = places[i]; if (!p) return;
    pause();
    $('chips').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', +b.dataset.i === i));
    const n = p.photos?.length || 0;
    const strip = (n ? p.photos.slice(0, 4) : [null, null]).map((src, k) => src
      ? `<button type="button" data-open="${i}" data-idx="${k}" aria-label="Open photo ${k + 1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`
      : '<div class="empty">Photo coming soon</div>').join('');
    $('card').innerHTML = `<button class="close" type="button" aria-label="Close">✕</button>
      <div class="pk" style="color:${KCOL[KIND(p)]}"><i style="background:${KCOL[KIND(p)]}"></i>${KLABEL[KIND(p)]}${p.tag ? ' · ' + esc(p.tag) : ''}</div>
      <h2>${esc(p.name)}</h2>
      <div class="meta">${esc(p.region)} · ${deg(p.lat, 'N', 'S')}, ${deg(p.lng, 'E', 'W')} · ${esc(when(p.date))}</div>
      ${p.note ? `<p>${esc(p.note)}</p>` : ''}
      <div class="strip">${strip}</div>
      <div class="foot"><span class="mono" style="color:var(--lichen);font-size:12px">${n ? n + ' photo' + (n > 1 ? 's' : '') : ''}</span><a href="scrapbook.html#journal">Open the journal →</a></div>`;
    $('card').hidden = false;
    SEL.p = p; world.pointsData(places).ringsData([p]).labelsData([p]);
    world.pointOfView({ lat: p.lat - (innerWidth < 760 ? 3 : 0.6), lng: p.lng + (innerWidth < 760 ? 0 : 3), altitude: 0.5 }, 1800);
  }
  function deselect() {
    $('card').hidden = true; SEL.p = null; world.pointsData(places).ringsData([]).labelsData([]);
    $('chips').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', 'false'));
    world.pointOfView({ altitude: 2.25 }, 1400);
    resumeLater(1500);
  }
  $('card').addEventListener('click', (e) => {
    if (e.target.closest('.close')) return deselect();
    const o = e.target.closest('[data-open]');
    if (o) { cur = +o.dataset.open; idx = +o.dataset.idx; show(); lb.showModal(); }
  });
  addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('card').hidden && !lb.open) deselect(); });

  /* ---------- lightbox ---------- */
  const lb = $('lightbox'); let cur = 0, idx = 0;
  const show = () => { const p = places[cur]; $('lb-img').src = p.photos[idx]; $('lb-img').alt = `${p.name}, photo ${idx + 1}`; $('lb-cap').textContent = `${p.name} · ${idx + 1} / ${p.photos.length}`; };
  $('lb-prev').onclick = () => { idx = (idx - 1 + places[cur].photos.length) % places[cur].photos.length; show(); };
  $('lb-next').onclick = () => { idx = (idx + 1) % places[cur].photos.length; show(); };
  $('lb-close').onclick = () => lb.close();
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
})();
</script>
</body>
</html>
