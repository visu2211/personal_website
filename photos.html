<style>
  .page-head { padding-block: clamp(60px, 10vw, 120px) 0; }
  .page-head h1 { font-size: clamp(52px, 9vw, 110px); line-height: .95; margin-top: 18px; }
  .page-head h1 span { color: var(--ember); }
  .albums { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 34px; }
  .albums button { font: 500 13px var(--f-body); color: var(--lichen); background: color-mix(in srgb, var(--pine) 80%, transparent); border: 1px solid var(--moss); padding: 8px 15px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
  .albums button small { font-family: var(--f-mono); font-size: 11px; opacity: .75; }
  .albums button[aria-pressed="true"] { background: var(--ember); border-color: var(--ember); color: var(--night); }
  .gallery { columns: 3 260px; column-gap: 16px; margin-top: 30px; }
  .ph { break-inside: avoid; margin: 0 0 16px; position: relative; border-radius: 12px; overflow: hidden; background: var(--pine); cursor: zoom-in; border: 0; padding: 0; width: 100%; display: block; text-align: left; color: inherit; }
  .ph img { width: 100%; height: auto; transition: transform .6s cubic-bezier(.2,.8,.2,1), filter .4s; filter: saturate(.9); }
  .ph:hover img { transform: scale(1.04); filter: saturate(1.05); }
  .ph figcaption { position: absolute; inset: auto 0 0 0; padding: 30px 14px 12px; font-size: 14px; background: linear-gradient(transparent, #000b); color: #fff; opacity: 0; transform: translateY(6px); transition: opacity .3s, transform .3s; }
  .ph:hover figcaption, .ph:focus-visible figcaption { opacity: 1; transform: none; }
  .ph figcaption small { display: block; font-family: var(--f-mono); font-size: 11px; opacity: .75; }
  .empty-album { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; margin-top: 30px; }
  .empty-album div { aspect-ratio: 4 / 5; border-radius: 12px; border: 1px dashed var(--moss); background: repeating-linear-gradient(135deg, #1a231f 0 10px, #1e2924 10px 20px); display: grid; place-items: center; font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--lichen); }
  .empty-album div:nth-child(2) { transform: translateY(18px); }
  dialog.lightbox { border: 0; padding: 0; background: transparent; max-width: min(92vw, 1200px); max-height: 94vh; }
  dialog.lightbox::backdrop { background: #050807eb; backdrop-filter: blur(4px); }
  .lb-inner { display: grid; gap: 12px; }
  .lb-inner img { max-height: 82vh; width: auto; max-width: 100%; margin: 0 auto; border-radius: 8px; }
  .lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; color: var(--bone); font-size: 14px; flex-wrap: wrap; }
  .lb-bar button { font: 500 13px var(--f-body); color: var(--bone); background: var(--pine); border: 1px solid var(--moss); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  .lb-bar button:hover { border-color: var(--ember); color: var(--ember); }
  @media (max-width: 560px) { .empty-album { grid-template-columns: repeat(2, minmax(0, 1fr)); } .empty-album div:nth-child(3) { display: none; } }
</style>

<script src="assets/photos.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const slug = (s) => s.toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
  const photos = window.PHOTOS || [];
  const albums = [...new Set([...(window.PHOTO_ALBUMS || []), ...photos.map((p) => p.album)])].filter(Boolean);
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const when = (d) => d ? `${MONTHS[+d.slice(5, 7) - 1] || ''} ${d.slice(0, 4)}`.trim() : '';
  let active = albums.find((a) => slug(a) === location.hash.slice(1)) || 'All';
  let shown = [];

  $('count').textContent = `${photos.length} photo${photos.length === 1 ? '' : 's'} · ${albums.length} albums`;

  function renderTabs() {
    $('albums').innerHTML = ['All', ...albums].map((a) => {
      const n = a === 'All' ? photos.length : photos.filter((p) => p.album === a).length;
      return `<button type="button" data-album="${esc(a)}" aria-pressed="${a === active}">${esc(a)} <small>${n}</small></button>`;
    }).join('');
  }
  function renderGrid() {
    shown = photos.filter((p) => active === 'All' || p.album === active);
    $('grid-wrap').innerHTML = shown.length
      ? `<div class="gallery">${shown.map((p, i) => `
          <button class="ph" type="button" data-i="${i}" aria-label="Open ${esc(p.caption || p.album)}">
            <img src="${esc(p.src)}" alt="${esc(p.caption || p.album)}" loading="lazy">
            ${p.caption || p.date ? `<figcaption>${esc(p.caption)}<small>${esc(p.album)}${p.date ? ' · ' + esc(when(p.date)) : ''}</small></figcaption>` : ''}
          </button>`).join('')}</div>`
      : `<div class="empty-album"><div>Photo coming soon</div><div>Photo coming soon</div><div>Photo coming soon</div></div>`;
  }
  $('albums').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    active = b.dataset.album;
    history.replaceState(null, '', active === 'All' ? location.pathname : '#' + slug(active));
    renderTabs(); renderGrid();
  });

  const lb = $('lightbox'); let idx = 0;
  const show = () => { const p = shown[idx]; $('lb-img').src = p.src; $('lb-img').alt = p.caption || p.album; $('lb-cap').textContent = [p.caption, p.album, when(p.date)].filter(Boolean).join(' · ') + `  (${idx + 1}/${shown.length})`; };
  $('grid-wrap').addEventListener('click', (e) => { const b = e.target.closest('[data-i]'); if (!b) return; idx = +b.dataset.i; show(); lb.showModal(); });
  $('lb-prev').onclick = () => { idx = (idx - 1 + shown.length) % shown.length; show(); };
  $('lb-next').onclick = () => { idx = (idx + 1) % shown.length; show(); };
  $('lb-close').onclick = () => lb.close();
  lb.addEventListener('click', (e) => { if (e.target === lb) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') $('lb-prev').click(); if (e.key === 'ArrowRight') $('lb-next').click(); });

  renderTabs(); renderGrid();
})();
</script>
<script src="assets/site.js"></script>
<script src="assets/palette.js"></script>
</body>
